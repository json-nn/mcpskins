plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeModule("maven.modrinth", "OypNE65K") // TACZ, MUKSC port
            includeModule("maven.modrinth", "SzzJttH8") // TACZ, official port
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.mcmodderanchor"
        }
    }
    maven {
        name = "Latvian Modder"
        url = "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            jvmArguments.addAll '-Xmx5G', '-Xms1G'
            programArguments.addAll '--width', '1280', '--height', '720'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Not run/: run/mods holds client-only mods (Iris, Sodium) a server must never load.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime: runtime-only for this project's runs, never pulled by dependents.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The release jar is built against MUKSC and must also run on the official port; compile with
// -PtaczPort=official to check that nothing links against a member only one of them has.
def taczPort = (project.findProperty('taczPort') ?: 'muksc').toString()
def taczDependency = [muksc: tacz_muksc_dependency, official: tacz_official_dependency][taczPort]
if (taczDependency == null) {
    throw new GradleException("Unknown taczPort '${taczPort}': expected 'muksc' or 'official'.")
}

dependencies {
    implementation taczDependency

    compileOnly "com.github.mcmodderanchor:simplebedrockmodel:2.2.2-neoforge-mc1.21.1"
    // Optional KubeJS integration. transitive = false: its POM pulls runtime-only artifacts with
    // ranges Gradle cannot resolve, none needed to compile.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }

    // Jar-in-jar inside TACZ; listed because the Modrinth maven has no transitive metadata.
    compileOnly("com.maydaymemory:mae:1.1.2") {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
}

// Expands ${} properties into src/main/templates (neoforge.mods.toml); a missing one is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            tacz_version_range     : tacz_version_range,
            kubejs_version_range   : kubejs_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
