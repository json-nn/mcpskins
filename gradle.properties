taczPort=muksc
tacz_muksc_dependency=maven.modrinth:OypNE65K:SISBXRRW
tacz_official_dependency=maven.modrinth:SzzJttH8:O2Pfsh6w
# Optional KubeJS integration, compile-only.
kubejs_version=2101.7.2-build.374
kubejs_version_range=[2101.7.0,)
rhino_version=2101.2.8-build.91
# Must match MCPSkins.MOD_ID.
mod_id=mcpskins
mod_name=TACZ: Advanced Skin System
mod_license=MIT
mod_version=1.2.0-neoforge-1.21.1
mod_group_id=org.minechestplate.mcpskins
